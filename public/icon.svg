<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4" />

  <!-- Inner Bento Graphic -->
  <g filter="url(#glow)">
    <!-- Main Diamond / Split emblem -->
    <path d="M 256 96 L 384 224 L 256 352 L 128 224 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Top-Right Growth Arrow (Bolsillo / Personal) -->
    <path d="M 256 224 L 352 128 M 352 128 L 290 128 M 352 128 L 352 190" fill="none" stroke="url(#emeraldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bottom-Left Reinvestment Loop (Reinversión) -->
    <path d="M 256 224 L 160 320 M 160 320 L 222 320 M 160 320 L 160 258" fill="none" stroke="url(#blueGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Currency / Value Symbol -->
  <circle cx="256" cy="224" r="38" fill="#0f172a" stroke="#334155" stroke-width="6" />
  <text x="256" y="238" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" fill="#34d399" text-anchor="middle">$</text>

  <!-- Split Pill at bottom -->
  <rect x="136" y="388" width="110" height="32" rx="16" fill="#064e3b" />
  <text x="191" y="409" font-family="monospace" font-weight="700" font-size="14" fill="#6ee7b7" text-anchor="middle">GANANCIA</text>

  <rect x="266" y="388" width="110" height="32" rx="16" fill="#1e3a8a" />
  <text x="321" y="409" font-family="monospace" font-weight="700" font-size="14" fill="#93c5fd" text-anchor="middle">REINVERTIR</text>
</svg>
